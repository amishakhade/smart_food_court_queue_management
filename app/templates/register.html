{% extends "base.html" %}

{% block title %}Register - Student Account{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card border-0 shadow-lg rounded-4 overflow-hidden">
                <div class="card-header bg-white border-bottom-0 pt-4 pb-2 text-center">
                    <div class="brand-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.6rem;">
                        <i class="bi bi-person-plus"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Student Account</h3>
                    <p class="text-muted small">Sign up to view past orders, track queue status, and expedite checkout.</p>
                </div>

                <div class="card-body p-4 pt-2">
                    <form method="POST" action="{{ url_for('auth.register') }}">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

                        <div class="mb-3">
                            <label for="full_name" class="form-label fw-semibold">Full Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control" id="full_name" name="full_name" required placeholder="e.g. Aarav Sharma">
                        </div>

                        <div class="row g-3 mb-3">
                            <div class="col-sm-6">
                                <label for="username" class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                                <input type="text" class="form-control" id="username" name="username" required placeholder="aarav123">
                            </div>
                            <div class="col-sm-6">
                                <label for="phone" class="form-label fw-semibold">Mobile Number</label>
                                <input type="tel" class="form-control" id="phone" name="phone" placeholder="9876543210">
                            </div>
                        </div>

                        <div class="mb-3">
                            <label for="email" class="form-label fw-semibold">College Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="student@campus.edu">
                        </div>

                        <div class="row g-3 mb-4">
                            <div class="col-sm-6">
                                <label for="password" class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="password" name="password" required minlength="6" placeholder="Min. 6 characters">
                            </div>
                            <div class="col-sm-6">
                                <label for="confirm_password" class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                                <input type="password" class="form-control" id="confirm_password" name="confirm_password" required minlength="6" placeholder="Re-type password">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold mb-3">
                            <i class="bi bi-check-circle-fill me-2"></i> Register Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <p class="text-muted small mb-0">Already registered? 
                            <a href="{{ url_for('auth.login') }}" class="fw-bold text-primary text-decoration-none">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

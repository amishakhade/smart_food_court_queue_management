{% extends "base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-exclamation-triangle-fill text-danger display-1 mb-3"></i>
                <h1 class="fw-bold mb-2">500 - Internal Server Error</h1>
                <p class="text-muted mb-4">An unexpected issue occurred while processing your request. The food court database transaction has been safely rolled back.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('student.home') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-arrow-repeat me-1"></i> Try Again
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

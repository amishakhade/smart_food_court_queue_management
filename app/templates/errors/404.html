{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-compass text-warning display-1 mb-3"></i>
                <h1 class="fw-bold mb-2">404 - Page Not Found</h1>
                <p class="text-muted mb-4">The food court page or order reference you are searching for does not exist or has been relocated.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('student.home') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house-door me-1"></i> Food Court Home
                    </a>
                    <a href="{{ url_for('student.menu') }}" class="btn btn-outline-secondary rounded-pill px-4">
                        Explore Menu
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

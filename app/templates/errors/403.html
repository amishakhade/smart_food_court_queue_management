{% extends "base.html" %}

{% block title %}Access Denied (403){% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-sm rounded-4 p-5 bg-white">
                <i class="bi bi-shield-lock-fill text-danger display-1 mb-3"></i>
                <h1 class="fw-bold mb-2">403 - Access Denied</h1>
                <p class="text-muted mb-4">You do not have the required permissions or role privileges to view this page.</p>
                <div class="d-flex justify-content-center gap-2">
                    <a href="{{ url_for('student.home') }}" class="btn btn-primary rounded-pill px-4">
                        <i class="bi bi-house-door me-1"></i> Return Home
                    </a>
                    <a href="{{ url_for('auth.login') }}" class="btn btn-outline-secondary rounded-pill px-4">
                        Sign In as Different Role
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
